packages:
  - apps/*
  - packages/*

allowBuilds:
  cpu-features: true
  esbuild: true
  msgpackr-extract: true
  nx: true
  protobufjs: true
  ssh2: true

catalog:
  "@nestjs/common": 11.2.3
  "@nestjs/core": 11.2.3
  "@nestjs/platform-express": 11.2.3
  "@nestjs/swagger": 11.4.7
  "@types/node": 26.4.0
  ajv: 8.20.0
  jose: 6.2.10
  pg: 8.23.0
  react: 19.2.8
  react-dom: 19.2.8
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  semver: 7.7.3
  typebox: 1.3.19
  typeorm: 1.1.0
  yaml: 2.9.0

overrides:
  qs: 6.16.0
  nx: 23.1.2
  "@nx/js": 23.1.2
  "@nx/eslint-plugin": 23.1.2
  typescript: 6.0.3

minimumReleaseAgeExclude:
  - "@nx/devkit@23.1.2"
  - "@nx/eslint-plugin@23.1.2"
  - "@nx/js@23.1.2"
  - "@nx/nx-darwin-arm64@23.1.2"
  - "@nx/nx-darwin-x64@23.1.2"
  - "@nx/nx-freebsd-x64@23.1.2"
  - "@nx/nx-linux-arm-gnueabihf@23.1.2"

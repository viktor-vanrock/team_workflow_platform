                  $ref: '../schemas/common/qa-common.v1.schema.json#/$defs/Digest'
      responses:
        '201':
          description: Append-only active membership created and active-set hash advanced atomically.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingMembershipCollection'

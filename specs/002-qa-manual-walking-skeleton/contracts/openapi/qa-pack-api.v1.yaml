        Under the QaRequestExtension aggregate CAS, derives and pins the current
        adjudicativeAggregateHash into immutable close content. This creates no Connector call.
        Any later adjudicative mutation advances the extension hash and makes this pre-dispatch
        candidate stale/INVALIDATED.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [dodAssessmentRef, requiredSessionPlanRef, expectedResourceVersion]
              properties:
                dodAssessmentRef:
                  $ref: '../schemas/common/qa-common.v1.schema.json#/$defs/ImmutableRevisionRef'
                requiredSessionPlanRef:
                  $ref: '../schemas/common/qa-common.v1.schema.json#/$defs/RequiredSessionPlanRef'
                expectedResourceVersion:
                  type: integer
                  minimum: 1
      responses:
        '201':
          description: Immutable completion content built from the exact READY_TO_CLOSE DoD, plan, verdict, evidence, defect refs, current adjudicative aggregate hash, resolved Binding/Profile chain and hashed typed request.transition(DONE); initial CAS delivery projection makes no Connector call.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '../schemas/qa/completion-candidate.v1.schema.json'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/work-items/{workItemId}/qa/completion-candidates/{completionCandidateId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkItemId'
      - $ref: '#/components/parameters/CompletionCandidateId'
    get:
      operationId: getQaCompletionCandidate
      tags: [QA Completion]
      responses:
        '200':
          description: Immutable hashed candidate content plus its guarded approval/command/confirmation lifecycle projection. REJECTED means the exact generic Approval rejected an AWAITING_APPROVAL candidate; a pre-approval stale candidate is INVALIDATED instead.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '../schemas/qa/completion-candidate.v1.schema.json'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/work-items/{workItemId}/qa/completion-candidates/{completionCandidateId}/final-close:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkItemId'
      - $ref: '#/components/parameters/CompletionCandidateId'
    get:
      operationId: getQaFinalCloseConfirmation
      tags: [QA Completion]
      responses:
        '200':
          description: Append-only confirmation record available only after generic confirmation derives DONE.
          content:
            application/json:
              schema:
                $ref: '../schemas/qa/final-close-confirmation.v1.schema.json'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: requestQaFinalClose
      tags: [QA Completion]
      description: >-
        Only the currently authorized HUMAN Executor may call this initiation route; QA Lead initiation
        is forbidden. The server persists the Executor identity, role/permission projection and
        authorization-basis hash. Approval must be made by a distinct, currently authorized QA Lead.
        A HUMAN rejection can occur only through that exact generic Approval while the candidate is
        AWAITING_APPROVAL; a CANDIDATE is never rejected and aggregate drift invalidates it instead.
        Approval/dispatch does not close the request; only generic confirmation
        deriving normalizedStatus=DONE emits qa.dod.satisfied. The pinned typed transition includes
        the hash-covered provider-neutral completion summary; the same external effect must materialize
        its scope, Verdict, residual risk and evidence/defect links and return a matching sanitized receipt.
        Immediately before dispatch the server atomically rechecks the candidate-pinned
        adjudicativeAggregateHash against the extension aggregate under its resourceVersion CAS,
        advances both Candidate and extension guard to DISPATCHED, persists command/effect, and only
        then appends the outbox row. Drift invalidates only a pre-dispatch candidate with zero Connector
        call for CANDIDATE, AWAITING_APPROVAL or AUTHORIZED; an already DISPATCHED guard rejects every
        adjudicative mutation and can advance only to CONFIRMED or FAILED reconciliation.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpectedContentHash'
      responses:
        '202':
          description: Generic Approval/typed request.transition(DONE) workflow accepted; response contains generic refs only.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncOperation'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/work-items/{workItemId}/qa/sessions/{sessionId}/evidence-manifests/{manifestId}/post-close-corrections:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkItemId'
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/ManifestId'
    post:
      operationId: createQaPostCloseManifestRevision
      tags: [QA Evidence]
      description: >-
        After confirmed DONE, creates a new CLERICAL_CORRECTION Evidence Manifest revision with
        evaluationStatus=POST_CLOSE_NOT_EVALUATED and isAdjudicative=false. It also records an audit
        marker, but never updates the existing adjudicative pointer, Verdict or DoD. A semantic
        conclusion change is rejected and requires a new linked QA request.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [previousManifestRevisionRef, adjudicativeManifestRevisionRef, correctionReason, clericalChanges]
              properties:
                previousManifestRevisionRef:
                  $ref: '../schemas/common/qa-common.v1.schema.json#/$defs/ImmutableRevisionRef'
                adjudicativeManifestRevisionRef:
                  $ref: '../schemas/common/qa-common.v1.schema.json#/$defs/ImmutableRevisionRef'
                correctionReason:
                  type: string
                  minLength: 1
                  maxLength: 2000
                clericalChanges:
                  description: Ordered annotations copied verbatim into manifest.clericalAnnotations before its contentHash is computed and signed.
                  type: array
                  minItems: 1
                  maxItems: 8
                  items:
                    type: object
                    additionalProperties: false
                    required: [ordinal, kind, text]
                    properties:
                      ordinal:
                        type: integer
                        minimum: 1
                      kind:
                        type: string
                        enum: [CORRECTION_NOTE, ARTIFACT_DISPLAY_LABEL]
                      artifactId:
                        type: string
                        format: uuid
                      text:
                        type: string
                        minLength: 1
                        maxLength: 2000
                    allOf:
                      - if:
                          properties:
                            kind:
                              const: ARTIFACT_DISPLAY_LABEL
                          required: [kind]
                        then:
                          required: [artifactId]
                        else:
                          not:
                            required: [artifactId]
      responses:
        '201':
          description: New non-adjudicative manifest revision plus marker; adjudicative pointer is unchanged.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [manifestRevision, postCloseCorrectionMarker, manifestHeaderResourceVersion, adjudicativeManifestRevisionRef, adjudicativePointerChanged]
                properties:
                  manifestRevision:
                    $ref: '../schemas/qa/evidence-manifest-revision.v1.schema.json'
                  postCloseCorrectionMarker:
                    $ref: '../schemas/qa/post-close-correction-marker.v1.schema.json'
                  manifestHeaderResourceVersion:
                    description: New stable manifest-header CAS version represented by the response ETag.
                    type: integer
                    minimum: 1
                  adjudicativeManifestRevisionRef:
                    $ref: '../schemas/common/qa-common.v1.schema.json#/$defs/ImmutableRevisionRef'
                  adjudicativePointerChanged:
                    const: false
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DraftId:
      name: draftId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkItemId:
      name: workItemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlanItemId:
      name: planItemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FindingId:
      name: findingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DefectDraftId:
      name: defectDraftId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VerdictId:
      name: verdictId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ManifestId:
      name: manifestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ManifestRevision:
      name: manifestRevision
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    RequiredSessionPlanId:
      name: requiredSessionPlanId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequiredSessionPlanRevision:
      name: requiredSessionPlanRevision
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CompletionCandidateId:
      name: completionCandidateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttachmentSessionId:
      name: attachmentSessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EvidenceArtifactLinkId:
      name: evidenceArtifactLinkId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DefectLinkId:
      name: defectLinkId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
  headers:
    ETag:
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    Location:
      schema:
        type: string
        format: uri-reference
  responses:
    Problem:
      description: >-
        RFC 9457 Problem Details; scope denial does not disclose resource existence. An
        adjudicative mutation racing a DISPATCHED completion returns the sanitized stable code
        COMPLETION_IN_FLIGHT and performs zero mutation/effect.
      content:
        application/problem+json:
          schema:
            type: object
            additionalProperties: false
            required: [type, title, status, code, correlationId]
            properties:
              type:
                type: string
                format: uri
              title:
                type: string
              status:
                type: integer
                minimum: 400
                maximum: 599
              detail:
                type: string
              instance:
                type: string
                format: uri-reference
              code:
                $ref: '../schemas/common/qa-common.v1.schema.json#/$defs/ErrorCode'
              correlationId:
                type: string
                format: uuid
  schemas:
    FindingMembershipCollection:
      description: Reload-safe append-only membership history plus the exact current active-set hash. The response ETag is the Finding aggregate CAS token for the next command.
      type: object
      additionalProperties: false
      required: [findingId, activeMembershipSetHash, memberships]
      properties:
        findingId:
          type: string
          format: uuid
        activeMembershipSetHash:
          $ref: '../schemas/common/qa-common.v1.schema.json#/$defs/Digest'
        memberships:
          type: array
          items:
            $ref: '../schemas/qa/finding-observation-membership.v1.schema.json'
    ExpectedResourceVersion:
      type: object
      additionalProperties: false
      required: [expectedResourceVersion]
      properties:
        expectedResourceVersion:
          type: integer
          minimum: 1
    ExpectedContentHash:
      type: object
      additionalProperties: false
      required: [expectedContentHash]
      properties:
        expectedContentHash:
          $ref: '../schemas/common/qa-common.v1.schema.json#/$defs/Digest'
    AsyncOperation:
      type: object
      additionalProperties: false
      required: [commandId, status, location]
      properties:
        commandId:
          type: string
          format: uuid
        status:
          type: string
          enum: [AWAITING_APPROVAL, QUEUED]
        approvalRef:
          $ref: '../schemas/common/qa-common.v1.schema.json#/$defs/GenericApprovalRef'
        location:
          type: string
          format: uri-reference
    PlatformActionOperation:
      type: object
      additionalProperties: false
      required: [platformActionRef, status, location]
      properties:
        platformActionRef:
          $ref: '../schemas/common/qa-common.v1.schema.json#/$defs/GenericPlatformActionRef'
        status:
          type: string
          enum: [AWAITING_APPROVAL, COMPLETED, INVALIDATED]
        location:
          type: string
          format: uri-reference

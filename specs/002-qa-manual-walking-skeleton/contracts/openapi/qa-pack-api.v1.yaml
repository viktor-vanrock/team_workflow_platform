    post:
      operationId: assignQaObservationToFinding
      tags: [QA Findings]
      description: >-
        Assigns one same-Session Observation to this non-frozen Finding. Actor and scope are
        server-derived; an Observation may have only one active Finding membership and reassignment
        requires releasing the prior row before a new append-only assignment.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'

        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [classification, reason, expectedCurrentReviewRef, expectedMembershipSetHash]
              properties:
                classification:
                  type: string
                  enum: [PRODUCT, INFRA, INCONCLUSIVE, DUPLICATE, ACCEPTED_RISK]
                reason:
                  type: string
                  minLength: 1
                  maxLength: 2000
                expectedCurrentReviewRef:
                  oneOf:
                    - type: 'null'
                    - $ref: '../schemas/common/qa-common.v1.schema.json#/$defs/ImmutableRevisionRef'
                expectedMembershipSetHash:
                  $ref: '../schemas/common/qa-common.v1.schema.json#/$defs/Digest'
      responses:
        '200':
          description: Human classification-only revision recorded; disposition remains a later explicit step.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [finding, reviewRevision]
                properties:
                  finding:
                    $ref: '../schemas/qa/finding.v1.schema.json'
                  reviewRevision:
                    $ref: '../schemas/qa/finding-review-revision.v1.schema.json'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/work-items/{workItemId}/qa/findings/{findingId}/disposition:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkItemId'
      - $ref: '#/components/parameters/FindingId'
    put:
      operationId: disposeQaFinding
      tags: [QA Findings]
      description: Records a human disposition revision. DUPLICATE always normalizes to the inseparable pair of an exact existing defect ref and the human disposition reason. ACCEPTED_RISK and WAIVED return a generic platform-action ref and remain ineffective until its distinct-QA-Lead decision is confirmed.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [dispositionDecision, dispositionReason, expectedReviewContentHash, expectedMembershipSetHash]
              properties:
                dispositionDecision:
                  type: string
                  enum: [CREATE_DEFECT, DUPLICATE, NOT_A_BUG, ACCEPTED_RISK, DEFERRED, WAIVED]
                dispositionReason:
                  type: string
                  minLength: 1
                  maxLength: 2000
                expectedReviewContentHash:
                  $ref: '../schemas/common/qa-common.v1.schema.json#/$defs/Digest'
                expectedMembershipSetHash:
                  $ref: '../schemas/common/qa-common.v1.schema.json#/$defs/Digest'
                duplicateDefectRef:
                  $ref: '../schemas/common/qa-common.v1.schema.json#/$defs/ExternalImmutableRef'
              allOf:
                - if:
                    properties:
                      dispositionDecision:
                        const: DUPLICATE
                    required: [dispositionDecision]
                  then:
                    required: [duplicateDefectRef, dispositionReason]
                  else:
                    not:
                      required: [duplicateDefectRef]
      responses:
        '200':
          description: Disposed Finding projection or pending generic exact platform action.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '../schemas/qa/finding.v1.schema.json'
                  - $ref: '#/components/schemas/PlatformActionOperation'
        default:
          $ref: '#/components/responses/Problem'

          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/work-items/{workItemId}/qa/sessions/{sessionId}/evidence-manifests:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkItemId'
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: listQaEvidenceManifests
      tags: [QA Evidence]
      responses:
        '200':
          description: Scoped manifest headers with latest and adjudicative pointers kept distinct.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../schemas/qa/evidence-manifest-history.v1.schema.json'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: reviewQaSessionAndPublishEvidence
      tags: [QA Evidence]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reviewKind, sessionOutcome, outcomeSummary, expectedExecutionSetHash, expectedFlakyDispositionBases]
              properties:
                reviewKind:
                  type: string
                  enum: [INITIAL, SUBSTANTIVE_CORRECTION]
                sessionOutcome:
                  type: string
                  enum: [PASSED, FAILED, BLOCKED, INCONCLUSIVE]
                outcomeSummary:
                  description: Exact bounded HUMAN-attested summary hashed into SessionReview and the signed manifest revision.
                  type: string
                  minLength: 1
                  maxLength: 10000
                expectedExecutionSetHash:
                  $ref: '../schemas/common/qa-common.v1.schema.json#/$defs/Digest'
                expectedFlakyDispositionBases:
                  description: >-
                    Exact DISPOSED bases already pinned by PASS + FLAKY_SUSPECTED result revisions.
                    The review UoW rechecks current same-scope refs/membership/policy and atomically
                    writes each FROZEN successor plus SessionReview and signed manifest.
                  type: array
                  uniqueItems: true
                  items:
                    $ref: '../schemas/qa/plan-item-result-revision.v1.schema.json#/$defs/FlakyDispositionBasis'
                previousManifestRevisionRef:
                  $ref: '../schemas/common/qa-common.v1.schema.json#/$defs/ImmutableRevisionRef'
                correctionReason:
                  type: string
                  minLength: 1
                  maxLength: 2000
              allOf:
                - if:
                    properties:
                      reviewKind:
                        const: SUBSTANTIVE_CORRECTION
                    required: [reviewKind]
                  then:
                    required: [previousManifestRevisionRef, correctionReason]
                  else:
                    not:
                      anyOf:
                        - required: [previousManifestRevisionRef]
                        - required: [correctionReason]
      responses:
        '201':
          description: Session review, DISPOSED-to-FROZEN Finding successors, signed manifest revision and COMPLETED transition committed atomically.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [session, sessionReview, manifestRevision, manifestHeaderResourceVersion]
                properties:
                  session:
                    $ref: '../schemas/qa/test-session.v1.schema.json'
                  sessionReview:
                    $ref: '../schemas/qa/session-review.v1.schema.json'
                  manifestRevision:
                    $ref: '../schemas/qa/evidence-manifest-revision.v1.schema.json'
                  manifestHeaderResourceVersion:
                    description: Stable manifest-header CAS version represented by the response ETag.
                    type: integer
                    minimum: 1
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/work-items/{workItemId}/qa/sessions/{sessionId}/evidence-manifests/{manifestId}:
    parameters:

asyncapi: 3.0.0
info:
  title: AWP Mattermost and Hermes events
  version: 1.0.0
  description: >-
    Normalized Feature 004 events carried by the existing durable project
    event outbox/inbox envelope. Provider request bodies, tokens, prompts and
    completions are never event payloads. The public bootstrap creates no event;
    rejected callbacks may create records only in the existing generic
    project-scoped security-audit facility, outside ActionProvenance and domain
    EventEnvelope messages.
defaultContentType: application/json
channels:
  candidateEvents:
    address: awp.intake.candidate.events.v1
    messages:
      sourceObserved: { $ref: '#/components/messages/CandidateSourceObserved' }
      discovered: { $ref: '#/components/messages/CandidateDiscovered' }
      decisionRecorded: { $ref: '#/components/messages/CandidateDecisionRecorded' }
      converted: { $ref: '#/components/messages/CandidateConverted' }
  draftEvents:
    address: awp.intake.draft.events.v1
    messages:
      revised: { $ref: '#/components/messages/DraftRevised' }
      validationCompleted: { $ref: '#/components/messages/DraftValidationCompleted' }
      confirmed: { $ref: '#/components/messages/DraftConfirmed' }
  agentEvents:
    address: awp.agent.run.events.v1
    messages:
      started: { $ref: '#/components/messages/AgentRunStarted' }
      completed: { $ref: '#/components/messages/AgentRunCompleted' }
      failed: { $ref: '#/components/messages/AgentRunFailed' }
      fallbackUsed: { $ref: '#/components/messages/AgentRunFallbackUsed' }
      actionDenied: { $ref: '#/components/messages/AgentActionDenied' }
  qaProposalEvents:
    address: awp.qa.proposal.events.v1
    messages:
      triageCreated: { $ref: '#/components/messages/TriageAssessmentCreated' }
      triageStale: { $ref: '#/components/messages/TriageAssessmentStale' }
      sessionPlanCreated: { $ref: '#/components/messages/SessionPlanProposalCreated' }
      sessionPlanStale: { $ref: '#/components/messages/SessionPlanProposalStale' }
  notificationEvents:
    address: awp.messaging.notification.events.v1
    messages:
      queued: { $ref: '#/components/messages/NotificationQueued' }
      delivered: { $ref: '#/components/messages/NotificationDelivered' }
      failed: { $ref: '#/components/messages/NotificationFailed' }
      expired: { $ref: '#/components/messages/NotificationExpired' }
operations:
  publishCandidateEvents:
    action: send
    channel: { $ref: '#/channels/candidateEvents' }
  publishDraftEvents:
    action: send
    channel: { $ref: '#/channels/draftEvents' }
  publishAgentEvents:
    action: send
    channel: { $ref: '#/channels/agentEvents' }
  publishQaProposalEvents:
    action: send
    channel: { $ref: '#/channels/qaProposalEvents' }
  publishNotificationEvents:
    action: send
    channel: { $ref: '#/channels/notificationEvents' }
components:
  messages:
    CandidateSourceObserved:
      name: intake.candidate.source-observed
      payload:
        allOf:
          - { $ref: '#/components/schemas/ProjectEnvelope' }
          - type: object
            required: [eventType, entityType, payloadVersion, payloadSchemaRef, payload]
            properties:
              eventType: { const: intake.candidate.source-observed }
              entityType: { const: intake-candidate }
              payloadVersion: { const: 1 }
              payloadSchemaRef:
                type: object
                properties:
                  id: { const: 'urn:awp:schemas:004:events:intake-candidate-source-observed:v1' }
                  version: { const: 1 }
              payload: { $ref: '../schemas/events/intake-candidate-source-observed.v1.schema.json' }
    CandidateDiscovered:

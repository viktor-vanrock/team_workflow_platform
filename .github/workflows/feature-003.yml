name: Feature 003 full gate

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-003-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-gate:
    name: Node 24.20.0 / full gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm 11.21.0
        uses: pnpm/action-setup@v4
        with:
          version: "11.21.0"
          run_install: false

      - name: Install exact Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the complete Feature 003 aggregate gate
        run: pnpm ci:003

      - name: Validate handoff-safe evidence
        run: pnpm verify:003:evidence
